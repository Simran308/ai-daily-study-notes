name: Daily AI lesson

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC = 8:00 AM Chicago (CDT); 7:00 AM in winter
  workflow_dispatch: # lets you run it by hand from the Actions tab
    inputs:
      resend_latest:
        description: "Preview: re-send the latest lesson as an Issue (free, no new lesson)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  lesson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate lesson
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STUDY_TZ: America/Chicago
          STUDY_MODEL: ${{ vars.STUDY_MODEL || 'claude-opus-5-5' }}
          RESEND_LATEST: ${{ inputs.resend_latest }}
        run: python scripts/generate_lesson.py

      - name: Commit lesson
        if: steps.gen.outputs.lesson_path != '' && !inputs.resend_latest
        run: |
          git config user.name "ai-daily-study[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lessons flashcards progress.json
          git commit -m "📚 Lesson: ${{ steps.gen.outputs.lesson_title }}"
          git push

      - name: Open issue (sends a GitHub notification)
        if: steps.gen.outputs.lesson_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-lesson --color 5319e7 2>/dev/null || true
          gh issue create \
            --title "📚 $(date +%F): ${{ steps.gen.outputs.lesson_title }}" \
            --body-file "${{ steps.gen.outputs.issue_body }}" \
            --label daily-lesson \
            --assignee "${{ github.repository_owner }}"
